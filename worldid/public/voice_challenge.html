<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyProof: AI音声クローン対策デモ</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f38;
    --text: #e8eaed;
    --muted: #8a929e;
    --accept: #22c55e;
    --reject: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Hiragino Sans, "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; line-height: 1.6; }
  .panels { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel {
    flex: 1 1 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  select, input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: #2563eb;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .output {
    margin-top: 16px;
    padding: 12px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    word-break: break-all;
    color: var(--muted);
    min-height: 20px;
    white-space: pre-wrap;
  }
  .verdict {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .verdict.accept { background: rgba(34,197,94,0.15); color: var(--accept); border: 1px solid var(--accept); }
  .verdict.reject { background: rgba(239,68,68,0.15); color: var(--reject); border: 1px solid var(--reject); }
  .checks { margin-top: 10px; font-size: 13px; font-weight: 400; text-align: left; }
  .checks div { margin: 4px 0; }
  .ok { color: var(--accept); }
  .ng { color: var(--reject); }
</style>
</head>
<body>
<div class="wrap">
  <h1>FamilyProof: 合言葉だけでは通らない</h1>
  <p class="sub">
    AI音声クローンが正しい合言葉を言えたとしても、「本人であること」の証明にはならないことを示すデモです。
    左が証明する側（電話の相手）、右が検証する側（受け取る家族）です。
    ※このページはWorld IDの概念を再現したモック実装です（nullifier_hashは疑似値）。
  </p>

  <div class="panels">
    <div class="panel">
      <h2>証明する側</h2>
      <label for="persona">誰として証明しますか？</label>
      <select id="persona">
        <option value="member">正規メンバー（娘）</option>
        <option value="attacker">攻撃者（AIクローン音声）</option>
      </select>
      <label for="proverPhrase">電話で聞いた合言葉</label>
      <input type="text" id="proverPhrase" placeholder="例: とらのもん">
      <button id="proveBtn">証明する</button>
      <div class="output" id="proveOutput">まだ証明していません</div>
    </div>

    <div class="panel">
      <h2>検証する側</h2>
      <label for="verifierPhrase">自分が実際に言った合言葉</label>
      <input type="text" id="verifierPhrase" value="とらのもん">
      <label>登録済みの正規メンバーnullifier_hash</label>
      <div class="output" id="registeredHash"></div>
      <label>on-chain FamilyRegistry root（ライブ取得）</label>
      <div class="output" id="onchainRoot">読み込み中...</div>
      <button id="verifyBtn">検証する</button>
      <div class="verdict" id="verdict" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
// 疑似nullifier_hash: 「同じ人物なら毎回同じ値になる」という World ID の性質だけを再現する簡易ハッシュ
function pseudoHash(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const hex = (h >>> 0).toString(16).padStart(8, '0');
  return '0x' + hex + hex;
}

const PERSONAS = {
  member: { label: '正規メンバー（娘）', hash: pseudoHash('trust-circle-member:musume') },
  attacker: { label: '攻撃者', hash: pseudoHash('trust-circle-member:attacker') },
};

document.getElementById('registeredHash').textContent = PERSONAS.member.hash;
async function loadOnchainRoot() {
  const el = document.getElementById('onchainRoot');
  try {
    const res = await fetch('https://worldchain-sepolia.g.alchemy.com/public', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: 1,
        method: 'eth_call',
        params: [{
          to: '0xa9f1A920A96c42BC4aA37DcB513CA615A3B7557d',
          data: '0xc7d91793' // familyRoot()
        }, 'latest']
      })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error.message);
    el.textContent = BigInt(json.result).toString();
  } catch (e) {
    el.textContent = '取得失敗: ' + e.message;
  }
}
loadOnchainRoot();

let lastProof = null;

document.getElementById('proveBtn').addEventListener('click', () => {
  const persona = document.getElementById('persona').value;
  const phrase = document.getElementById('proverPhrase').value;
  const hash = PERSONAS[persona].hash;
  lastProof = { signal: phrase, nullifierHash: hash };
  document.getElementById('proveOutput').textContent =
    `signal: "${phrase}"\nnullifier_hash: ${hash}\n(${PERSONAS[persona].label} として証明)`;
});

document.getElementById('verifyBtn').addEventListener('click', () => {
  const verdictEl = document.getElementById('verdict');
  verdictEl.style.display = 'block';

  if (!lastProof) {
    verdictEl.className = 'verdict reject';
    verdictEl.textContent = '❌ まだ証明する側が実行していません';
    return;
  }

  const refPhrase = document.getElementById('verifierPhrase').value.trim().toLowerCase();
  const signal = lastProof.signal.trim().toLowerCase();
  const signalMatch = refPhrase === signal;
  const hashMatch = lastProof.nullifierHash === PERSONAS.member.hash;

  const checksHtml =
    '<div class="checks">' +
    `<div class="${signalMatch ? 'ok' : 'ng'}">${signalMatch ? '✅' : '❌'} 合言葉が一致</div>` +
    `<div class="${hashMatch ? 'ok' : 'ng'}">${hashMatch ? '✅' : '❌'} 登録済みメンバーのnullifier_hashと一致</div>` +
    '</div>';

  if (signalMatch && hashMatch) {
    verdictEl.className = 'verdict accept';
    verdictEl.innerHTML = '✅ 受理：本人からの正当な確認です' + checksHtml;
  } else if (signalMatch && !hashMatch) {
    verdictEl.className = 'verdict reject';
    verdictEl.innerHTML = '❌ 拒否：合言葉は合っていますが、本人ではありません（AI音声クローンの可能性）' + checksHtml;
  } else {
    verdictEl.className = 'verdict reject';
    verdictEl.innerHTML = '❌ 拒否：合言葉が一致しません' + checksHtml;
  }
});
</script>
</body>
</html>
