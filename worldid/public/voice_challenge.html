<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FamilyProof: AI音声クローン対策デモ</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --border: #2a2f38;
    --text: #e8eaed;
    --muted: #8a929e;
    --accept: #22c55e;
    --reject: #ef4444;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Hiragino Sans, "Noto Sans JP", sans-serif;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 24px; line-height: 1.6; }
  .panels { display: flex; gap: 16px; flex-wrap: wrap; }
  .panel {
    flex: 1 1 320px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 4px; }
  select, input[type="text"] {
    width: 100%;
    padding: 8px 10px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
  }
  button {
    margin-top: 16px;
    width: 100%;
    padding: 10px;
    background: #2563eb;
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #1d4ed8; }
  .output {
    margin-top: 16px;
    padding: 12px;
    background: #0f1216;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 12px;
    font-family: monospace;
    word-break: break-all;
    color: var(--muted);
    min-height: 20px;
    white-space: pre-wrap;
  }
  .verdict {
    margin-top: 16px;
    padding: 14px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    text-align: center;
  }
  .verdict.accept { background: rgba(34,197,94,0.15); color: var(--accept); border: 1px solid var(--accept); }
  .verdict.reject { background: rgba(239,68,68,0.15); color: var(--reject); border: 1px solid var(--reject); }
  .checks { margin-top: 10px; font-size: 13px; font-weight: 400; text-align: left; }
  .checks div { margin: 4px 0; }
  .ok { color: var(--accept); }
  .ng { color: var(--reject); }
</style>
</head>
<body>
<div class="wrap">
  <h1>FamilyProof: 合言葉だけでは通らない</h1>
  <p class="sub">
    シナリオ：母のもとに「娘」を名乗る電話がかかってくる。声はそっくりだが、AI音声クローンかもしれない。<br>
    母はその場で合言葉を決めて電話で伝え、相手はその合言葉を焼き込んだ World ID の証明を送る。
    AIクローンは合言葉を聞き取れても、娘本人の World ID では証明できない ―― 合言葉だけでは通らない。<br>
    ※ 本物の World ID（Orb 認証）で検証しています
  </p>

  <div class="panels">
    <div class="panel">
      <h2>検証する側（母）</h2>
      <label for="verifierPhrase">① その場で合言葉を決めて、電話で伝える</label>
      <input type="text" id="verifierPhrase" value="とらのもん">
      <label>登録済みの家族（World ID nullifier）</label>
      <div class="output" id="registeredHash"></div>
      <label>on-chain FamilyRegistry root（ライブ取得）</label>
      <div class="output" id="onchainRoot">読み込み中...</div>
      <button id="verifyBtn">④ 検証する</button>
      <div class="verdict" id="verdict" style="display:none;"></div>
    </div>

    <div class="panel">
      <h2>証明する側（電話の相手）</h2>
      <label for="proverPhrase">② 電話で聞いた合言葉を入力</label>
      <input type="text" id="proverPhrase" placeholder="例: とらのもん">
      <button id="proveBtn">③ World ID で証明する（スマホで承認）</button>
      <div class="output" id="proveOutput">まだ証明していません</div>
    </div>
  </div>
</div>

<script type="module">
  import { IDKit, orbLegacy } from "https://esm.sh/@worldcoin/idkit-core";

  const APP_ID = "app_91d0df3badaff1ca70f7064ed5433114";
  const ACTION = "familyproof-call-check"; 


document.getElementById('registeredHash').textContent = "サーバーに登録済み";
async function loadOnchainRoot() {
  const el = document.getElementById('onchainRoot');
  try {
    const res = await fetch('https://worldchain-sepolia.g.alchemy.com/public', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        jsonrpc: '2.0',
        id: 1,
        method: 'eth_call',
        params: [{
          to: '0xa9f1A920A96c42BC4aA37DcB513CA615A3B7557d',
          data: '0xc7d91793' // familyRoot()
        }, 'latest']
      })
    });
    const json = await res.json();
    if (json.error) throw new Error(json.error.message);
    el.textContent = BigInt(json.result).toString();
  } catch (e) {
    el.textContent = '取得失敗: ' + e.message;
  }
}
loadOnchainRoot();

let lastProof = null;

document.getElementById("proveBtn").addEventListener("click", async () => {
    const outputEl = document.getElementById("proveOutput");
    const phrase = document.getElementById("proverPhrase").value.trim();
    if (!phrase) {
      outputEl.textContent = "合言葉を入力してください。"
      return ;
    }
    outputEl.textContent = "サーバーに署名をもらっています...";

 
    const url = "/api/rp-signature";
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action:ACTION})
    });
    const rpContext = await res.json();

    outputEl.textContent = "World ID のリクエストを作成しています...";

try {
      const request = await IDKit.request({
        app_id: APP_ID,
        action: ACTION,
        rp_context:rpContext,
        allow_legacy_proofs: false,
      }).preset(orbLegacy({ signal: phrase}));
      
      outputEl.textContent = "下のリンクをスマホの World App で開いて承認してください:\n" + request.connectorURI;

      const completion = await request.pollUntilCompletion();
      const comp_json = JSON.stringify(completion, null, 2);
      const {success, result} = completion;
      if (!success) {
        console.log(comp_json);
        outputEl.textContent += "\n\nIDKit失敗:\n" + comp_json;      
        return ;
      }

      console.log(JSON.stringify(result, null, 2));
      const proof = result.responses[0];
      outputEl.textContent =
        `✅ World ID（${proof.identifier}）で証明しました\n` +
        `合言葉: "${phrase}"\n` +
        `nullifier: ${proof.nullifier.slice(0, 10)}…${proof.nullifier.slice(-4)}\n\n` +
        `→ 左の「④ 検証する」を押してください`;
      lastProof = result;

  } catch(e){
      outputEl.textContent = "エラー:" + e.message;
      return ;
  }
  });

document.getElementById('verifyBtn').addEventListener('click', async () => {
  const verdictEl = document.getElementById('verdict');
  verdictEl.style.display = 'block';

  if (!lastProof) {
    verdictEl.className = 'verdict reject';
    verdictEl.textContent = '❌ まだ証明する側が実行していません';
    return;
  }

  const refPhrase = document.getElementById('verifierPhrase').value.trim();
  try{
    const url = "/api/verify-call";
    const res = await fetch(url, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({IDKitResponse: lastProof, phrase: refPhrase})
    });
    const {humanOk, phraseOk, memberOk} = await res.json();
    const checksHtml =
      '<div class="checks">' +
      `<div class="${humanOk? 'ok' : 'ng'}">${humanOk ? '✅' : '❌'}  実在の人間（World ID / Orb）</div>` +
      `<div class="${phraseOk? 'ok' : 'ng'}">${phraseOk ? '✅' : '❌'}  合言葉が一致</div>` +
      `<div class="${memberOk? 'ok' : 'ng'}">${memberOk ? '✅' : '❌'}  登録済みの家族</div>` +
      '</div>';

    if (humanOk && phraseOk && memberOk) {
      verdictEl.className = 'verdict accept';
      verdictEl.innerHTML = '✅ 受理：本人からの正当な確認です' + checksHtml;
    } else if (!humanOk) {
      verdictEl.className = 'verdict reject';
      verdictEl.innerHTML = '❌ 拒否：World ID の検証に失敗しました' + checksHtml;
    } else if (!phraseOk) {
      verdictEl.className = 'verdict reject';
      verdictEl.innerHTML = '❌ 拒否：合言葉が一致しません' + checksHtml;
    } else {
      verdictEl.className = 'verdict reject';
      verdictEl.innerHTML = '❌ 拒否：合言葉は合っていますが、本人ではありません' + checksHtml;
    }
  } catch(e) {
    verdictEl.className = 'verdict reject';
    verdictEl.textContent = `エラー： ${e}`;
  } 
});
</script>
</body>
</html>
